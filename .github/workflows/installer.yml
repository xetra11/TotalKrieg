name: Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # this Node.js ships in the installer
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        run: go test ./...

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./installer/build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')

      # the file name stays the same, so a "latest" link always works
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MISSIONMAKER: ${{ steps.build.outputs.missionmaker }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/TotalKrieg-setup.exe --title $env:GITHUB_REF_NAME --generate-notes --notes "Includes MiusMissionMaker $env:MISSIONMAKER." ||
            gh release upload $env:GITHUB_REF_NAME dist/TotalKrieg-setup.exe --clobber
